@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130F;--surface:#1E1B17;--sunk:#191612;--line:#2E2A24;--fg:#F1ECE4;--muted:#B3A99C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130F;--surface:#1E1B17;--sunk:#191612;--line:#2E2A24;--fg:#F1ECE4;--muted:#B3A99C;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,4vw,2.4rem)}
.eyebrow{font:600 .74rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.main{background:var(--brand);color:var(--brand-ink)}
.btn.line{box-shadow:inset 0 0 0 1.5px currentColor;background:transparent}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.logo{font:600 1.25rem var(--serif);text-decoration:none}
nav{margin-left:auto;display:flex;gap:4px;align-items:center}
nav a{padding:7px 11px;border-radius:99px;text-decoration:none;font-weight:500;font-size:.93rem}
nav a:hover{background:var(--sunk)}
@media (max-width:760px){nav a.nl{display:none}}
.lang{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:99px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
/* hero */
.hero{position:relative;min-height:min(78vh,620px);display:grid;align-items:end;color:#fff;background:#222 center/cover;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(0 0 0 / .15) 0%,rgb(0 0 0 / .7) 100%)}
.hero .wrap{padding-top:48px;padding-bottom:48px;width:100%}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem)}
.hero p{font-size:1.15rem;max-width:34em;margin-top:12px;color:rgb(255 255 255 / .88)}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .btn.line{color:#fff}
.status{display:inline-flex;align-items:center;gap:8px;background:rgb(255 255 255 / .92);color:#1D1A16;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.88rem;margin-bottom:16px}
.status i{width:9px;height:9px;border-radius:50%;background:#2F7A4A}
.status.closed i{background:#B3392E}
/* sections */
section{padding:64px 0}
.band{background:var(--surface);border-block:1px solid var(--line)}
.head{display:grid;gap:10px;margin-bottom:28px;max-width:40em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.facts{grid-template-columns:1fr}}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.fact b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
/* menu / rooms */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:2px 32px}
@media (max-width:760px){.items{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item b{font-family:var(--serif);font-size:1.15rem;font-weight:600}
.item .p{font-weight:700;white-space:nowrap;text-align:right}
.item .p small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.item p{grid-column:1/-1;margin:0;color:var(--muted);font-size:.93rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);margin-left:6px;vertical-align:middle}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.rooms{grid-template-columns:1fr}}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.room .ph{aspect-ratio:3/2;background:var(--sunk) center/cover}
.room .bd{padding:16px;display:grid;gap:6px}
.room .bd .pr{font-weight:700}
.room .bd .pr small{color:var(--muted);font-weight:500}
/* booking */
.book{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:860px){.book{grid-template-columns:1fr}}
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.84rem;color:var(--muted)}
.err{color:#B3392E;font-weight:600;font-size:.88rem}
/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.revs{grid-template-columns:1fr}}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.stars{color:#D9A21B;letter-spacing:2px}
.reply{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.reply b{display:block;font-size:.78rem;color:var(--muted)}
.score{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.score big{font:600 2.6rem var(--serif)}
/* map + faq */
.map{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:start}
@media (max-width:860px){.map{grid-template-columns:1fr}}
.map iframe{width:100%;aspect-ratio:4/3;border:0;border-radius:var(--r);background:var(--sunk)}
details{border-bottom:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.fab svg{width:28px;height:28px;fill:#fff}
footer{padding:30px 0 90px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
.demo-bar{background:var(--fg);color:var(--bg);font-size:.8rem;text-align:center;padding:6px 12px}
</style>
</head>

let L = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
try { if (!new URLSearchParams(location.search).get("lang")) { const s = localStorage.getItem("lang-" + D.id); if (s === "en" || s === "es") L = s; } } catch {}
const t = k => (D.t[k] || {})[L] ?? "";
const pick = o => o && typeof o === "object" && "es" in o ? o[L] : o;

function merida() {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/Merida", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
  const g = k => p.find(x => x.type === k)?.value;
  return { day: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(g("weekday")), min: (+g("hour") % 24) * 60 + +g("minute") };
}
function openNow() {
  if (!D.hours) return null;
  const { day, min } = merida(); const h = D.hours[day]; if (!h) return { open: false, next: null };
  const [a, b] = h.map(x => { const [hh, mm] = x.split(":").map(Number); return hh * 60 + mm; });
  return { open: min >= a && min < b, opens: h[0], closes: h[1], before: min < a };
}
function render() {
  document.documentElement.lang = L;
  document.title = pick(D.title);
  $("#l-es").setAttribute("aria-pressed", String(L === "es")); $("#l-en").setAttribute("aria-pressed", String(L === "en"));
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("#logo").textContent = D.name;
  $("#hero").style.backgroundImage = `url('${D.heroImg}')`;
  $("#h1").textContent = D.name; $("#tag").textContent = pick(D.tagline);
  renderStatus();
  $("#facts").innerHTML = D.facts.map(f => `<div class="fact"><b>${esc(pick(f.k))}</b>${esc(pick(f.v))}</div>`).join("");
  renderMain();
  renderForm();
  const avg = D.reviews.reduce((a, r) => a + r.stars, 0) / D.reviews.length;
  $("#avg").textContent = (D.rating || avg).toFixed(1); $("#avgStars").textContent = "★★★★★"; $("#avgN").textContent = `${D.reviewCount} ${t("reviewsOn")}`;
  $("#revs").innerHTML = D.reviews.map(r => `<div class="rev"><div style="display:flex;justify-content:space-between"><b>${esc(r.name)}</b><span class="stars">${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</span></div><p style="margin:0">${esc(r.text)}</p><span class="note">Google · ${esc(pick(r.when))}</span>${r.reply ? `<div class="reply"><b>${t("ownerReply")}</b>${esc(r.reply)}</div>` : ""}</div>`).join("");
  $("#addr").textContent = pick(D.address);
  $("#mapf").src = "https://www.google.com/maps?q=" + encodeURIComponent(D.mapQuery) + "&z=16&output=embed";
  $("#dir").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(D.mapQuery);
  $("#faq").innerHTML = D.faq.map(f => `<details><summary>${esc(pick(f.q))}</summary><p>${esc(pick(f.a))}</p></details>`).join("");
  $("#fab").href = `https://wa.me/${D.wa}?text=${encodeURIComponent(t("waHello"))}`;
}
function renderStatus() {
  const st = $("#status"), o = openNow();
  if (o) { st.classList.toggle("closed", !o.open); st.querySelector("span").textContent = o.open ? `${t("openNow")} · ${t("until")} ${o.closes}` : (o.opens ? `${t("closedNow")} · ${t("opensAt")} ${o.opens}` : t("closedNow")); }
  else st.querySelector("span").textContent = pick(D.statusText);
}
let tab = 0;
function renderMain() {
  const box = $("#mainBody");
  if (D.menu) {
    box.innerHTML = `<div class="tabs" role="group">${D.menu.map((c, i) => `<button type="button" data-i="${i}" aria-pressed="${i === tab}">${esc(pick(c.cat))}</button>`).join("")}</div><div class="items">${D.menu[tab].items.map(it => `<div class="item"><b>${esc(pick(it.n))}${(it.tags || []).map(g => `<span class="tag">${esc(t("tag_" + g))}</span>`).join("")}</b><span class="p">$${it.p}${L === "en" ? `<small>${usd(it.p)}</small>` : ""}</span><p>${esc(pick(it.d))}</p></div>`).join("")}</div>`;
    box.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { tab = +b.dataset.i; renderMain(); }));
  } else {
    box.innerHTML = `<div class="rooms">${D.rooms.map(r => `<div class="room"><div class="ph" style="background-image:url('${r.img}')"></div><div class="bd"><h3>${esc(pick(r.n))}</h3><p class="muted" style="margin:0">${esc(pick(r.d))}</p><span class="pr">${mxn(r.p)} <small>${t("perNight")}${L === "en" ? " · " + usd(r.p) : ""}</small></span></div></div>`).join("")}</div>`;
  }
}
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function renderForm() {
  const f = $("#bf"), keep = {}; f.querySelectorAll("input,select,textarea").forEach(x => keep[x.id] = x.value);
  if (D.menu) {
    const times = []; for (let m = 13 * 60; m <= 21 * 60 + 30; m += 30) times.push(`${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
    f.innerHTML = `<div class="g2"><label>${t("date")}<input type="date" id="f-date" min="${todayISO()}" required></label><label>${t("time")}<select id="f-time">${times.map(x => `<option>${x}</option>`).join("")}</select></label></div>
      <div class="g2"><label>${t("people")}<select id="f-ppl">${[1, 2, 3, 4, 5, 6, 7, 8, 10, 12].map(n => `<option>${n}</option>`).join("")}</select></label><label>${t("zone")}<select id="f-zone">${t("zones").split("|").map(z => `<option>${z}</option>`).join("")}</select></label></div>`;
  } else {
    f.innerHTML = `<div class="g2"><label>${t("checkin")}<input type="date" id="f-date" min="${todayISO()}" required></label><label>${t("checkout")}<input type="date" id="f-out" min="${todayISO()}" required></label></div>
      <div class="g2"><label>${t("guests")}<select id="f-ppl">${[1, 2, 3, 4].map(n => `<option>${n}</option>`).join("")}</select></label><label>${t("roomType")}<select id="f-zone">${D.rooms.map(r => `<option>${esc(pick(r.n))}</option>`).join("")}</select></label></div>`;
  }
  f.innerHTML += `<label>${t("name")}<input type="text" id="f-name" autocomplete="name" required></label><label>${t("notes")}<textarea id="f-notes" placeholder="${esc(t("notesPh"))}"></textarea></label>
    <button class="btn main" type="submit">${t("send")}</button><p class="err" id="f-err" role="alert" hidden></p><p class="note">${t("formNote")}</p>`;
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el && v) el.value = v; });
}
const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString(L === "en" ? "en-US" : "es-MX", { weekday: "long", day: "numeric", month: "long" });
$("#bf").addEventListener("submit", e => {
  e.preventDefault();
  const v = id => (document.getElementById(id) || {}).value || "";
  const err = $("#f-err");
  if (!v("f-date") || !v("f-name").trim() || (!D.menu && !v("f-out"))) { err.textContent = t("missing"); err.hidden = false; return; }
  if (!D.menu && v("f-out") <= v("f-date")) { err.textContent = t("badDates"); err.hidden = false; return; }
  err.hidden = true;
  const lines = D.menu
    ? [t("waBook"), `${t("date")}: ${fmtDate(v("f-date"))}`, `${t("time")}: ${v("f-time")}`, `${t("people")}: ${v("f-ppl")}`, `${t("zone")}: ${v("f-zone")}`]
    : [t("waBook"), `${t("checkin")}: ${fmtDate(v("f-date"))}`, `${t("checkout")}: ${fmtDate(v("f-out"))}`, `${t("guests")}: ${v("f-ppl")}`, `${t("roomType")}: ${v("f-zone")}`];
  lines.push(`${t("name")}: ${v("f-name").trim()}`); if (v("f-notes").trim()) lines.push(`${t("notes")}: ${v("f-notes").trim()}`);
  window.open(`https://wa.me/${D.wa}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank", "noopener");
});
function setLang(l) { L = l; try { localStorage.setItem("lang-" + D.id, l); } catch {} render(); }
$("#l-es").addEventListener("click", () => setLang("es")); $("#l-en").addEventListener("click", () => setLang("en"));
render();
setInterval(renderStatus, 60000);
})();
</script>
</body>
</html>
